name: Scrape MFM

on:
  schedule:
    - cron: '0 16 * * *' # daily 16:00 UTC
  workflow_dispatch: # manual trigger
    inputs:
      dry-run:
        description: Scrape, plan and render the changelog, but publish nothing (no PR, comment, issue or Discord message)
        type: boolean
        default: false
      cross-check:
        description: Also compare every page with the runner's Google Chrome render (mfm scrape --browser)
        type: boolean
        default: false

permissions: {}

# A dry run publishes nothing, so it needn't wait for a real run. In the same group, a
# queued dry run would also cancel a queued scheduled one.
concurrency:
  group: ${{ inputs.dry-run && 'scrape-dry-run' || 'scrape' }}
  cancel-in-progress: false

# The App's private key never shares a job with dependency code: any step can read every
# secret its job uses from the runner's memory, and the App can write to more than this
# repository. So `scrape` runs pnpm, every repository script and, for a cross-check,
# Google Chrome, with no secrets, and hands the staged update on as an artifact; `publish`
# mints the App's token and opens the PR with pinned actions and a copy, nothing else.
# `brief`, in between, holds the model's key the same way: pinned actions and one
# dependency-free script. `announce` and `report` run our code again, with the default
# token. A dry run runs `scrape` and `brief` only (and `app-check`). See "The App token"
# and "In brief, by a model" in specs/change-tracking.md.
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the scrape takes under a minute over HTTP, a few with the cross-check
    permissions:
      contents: read # check out the code
      pull-requests: read # list the open update PRs
    outputs:
      branch: ${{ steps.plan.outputs.branch }}
      base: ${{ steps.plan.outputs.base }}
      base-sha: ${{ steps.bundle.outputs.base-sha }}
      below: ${{ steps.plan.outputs.below }}
      title: ${{ steps.changelog.outputs.title }}
    steps:
      # Audit only: records outbound connections and processes, blocks nothing.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The fetches below need no credentials (the repository is public).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: false # "No dependency cache" in specs/change-tracking.md
          cache-dependency-path: .github/no-dependency-cache # matches no file: no cache at all

      # Every step below with logic in it runs one `mfm` command (src/bin/mfm.ts; see
      # `--help` on each). `pnpm scrape` is `mfm scrape`; the rest are called as
      # node_modules/.bin/tsx rather than `pnpm exec tsx`, because pnpm can print its own
      # status lines ("Already up to date", "Done in …") to stdout, which is how #78's
      # Discord marker came to record "Already" instead of the message id. Results a later
      # step reads go to files (--output "$GITHUB_OUTPUT", --body-file), never through a
      # captured stdout.

      # Update PRs are sticky: the scrape matches `firstSeen` dates against each open
      # one's data/ as well as main's, so a run that finds nothing new reproduces its
      # branch byte for byte (src/ops/open-prs.ts). Branch names reach the shell through
      # step outputs and word splitting only, never ${{ }}.
      - name: Fetch the open update PRs' dates
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: node_modules/.bin/tsx src/bin/mfm.ts open-prs --out /tmp/pr-data --json /tmp/update-prs.json --output "$GITHUB_OUTPUT"

      # HTTP only. The cross-check input also renders every page in the Google Chrome the
      # runner image ships and compares (src/cross-check.ts); nothing installs a browser.
      - name: Scrape
        env:
          DATES: ${{ steps.open.outputs.dates }}
          BROWSER: ${{ inputs.cross-check && '--browser' || '' }}
        # $DATES and $BROWSER are unquoted on purpose: one `--dates-from <dir>` pair per open
        # PR, and no argument at all when there's no cross-check.
        run: pnpm scrape --report /tmp/failures.md $DATES $BROWSER

      # One PR per MFM version, stacked: the live version's open PR is updated on its own
      # base, and a new version gets a new PR on top of the open one instead of
      # rebuilding it. See "One PR per version, stacked" in specs/change-tracking.md.
      - name: Plan the update PR
        id: plan
        run: node_modules/.bin/tsx src/bin/mfm.ts plan /tmp/update-prs.json data --output "$GITHUB_OUTPUT"

      # The PR is diffed against its base, not main: body, changelog entry and
      # announcement all compare the base's data/ with the scrape.
      - name: Snapshot the base's data
        env:
          BASE: ${{ steps.plan.outputs.base }}
        run: node_modules/.bin/tsx src/bin/mfm.ts branch-data "$BASE" /tmp/old-data

      - name: Generate changelog
        id: changelog
        run: node_modules/.bin/tsx src/bin/mfm.ts diff /tmp/old-data data --body-file /tmp/changelog.md --output "$GITHUB_OUTPUT"

      # The commit is built on a checkout of the base, so it carries the base's changelog
      # files plus this update's entry: changelog/v<version>.md and the regenerated
      # DATA-CHANGELOG.md index. The tools still run from main's checkout.
      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.base }}
          path: pub
          persist-credentials: false

      - name: Stage the update on the base
        working-directory: pub
        run: |
          rm -rf data
          cp -r ../data data
          ../node_modules/.bin/tsx ../src/bin/mfm.ts changelog /tmp/old-data data

      # Everything the later jobs need, in one place: the staged files, the two snapshots
      # and the PR body. The base's exact commit goes with them, so `publish` stages the
      # update on the tree it was built on.
      - name: Bundle the update
        id: bundle
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          mkdir -p /tmp/update/staged
          cp -r pub/data pub/changelog pub/DATA-CHANGELOG.md /tmp/update/staged/
          cp -r /tmp/old-data /tmp/changelog.md /tmp/update/
          cp -r data /tmp/update/new-data
          # The open PR's body, when this update has one: `brief` keeps its brief while the
          # changelog under it is the same.
          if [ -f "/tmp/pr-data/$BRANCH.body.md" ]; then cp "/tmp/pr-data/$BRANCH.body.md" /tmp/update/previous-body.md; fi
          echo "base-sha=$(git -C pub rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Hand the update on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update
          path: /tmp/update
          if-no-files-found: error
          retention-days: 7

      # The later jobs publish, so a dry run shows what they would have published instead.
      - name: Show the dry run
        if: inputs.dry-run
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          BASE: ${{ steps.plan.outputs.base }}
          BELOW: ${{ steps.plan.outputs.below }}
          TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          set -euo pipefail
          {
            echo "## Dry run: nothing was published"
            echo
            echo "- Branch: \`$BRANCH\`, based on \`$BASE\`"
            echo "- PRs below: ${BELOW:-none}"
            echo "- Title: $TITLE"
            echo
            echo "Files the update commit would change, against the base:"
            echo
            echo '```'
            git -C pub status --short | grep . || echo "(none: the scrape matches the base)"
            echo '```'
            echo
            echo "The PR body:"
            echo
            cat /tmp/changelog.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "The Discord payload (not sent):"
          node_modules/.bin/tsx src/bin/mfm.ts announce /tmp/update/old-data /tmp/update/new-data

      # For `report`: the per-faction errors, when the scrape got as far as writing them.
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-report
          path: /tmp/failures.md
          if-no-files-found: ignore
          retention-days: 7

      # For drift-fix.yml, whose agent never reaches the site: the pages that show why the
      # parse failed, as they are now, with the report. Only for a failure the parser could
      # have caused: with no report, or only failed fetches in it, this saves nothing (an
      # outage, not drift), and with nothing saved there is no artifact and no agent run. A
      # dry run's artifact has its own name, which only a manual replay takes. See "The
      # drift fixer" in specs/change-tracking.md.
      - name: Refresh the failing factions' pages
        if: failure()
        run: |
          node_modules/.bin/tsx src/bin/mfm.ts refresh-fixtures --failed /tmp/failures.md --out /tmp/drift/fixtures
          if [ -d /tmp/drift/fixtures ]; then cp /tmp/failures.md /tmp/drift/; fi
      - name: Hand the drift on
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.dry-run && 'drift-dry-run' || 'drift' }}
          path: /tmp/drift
          if-no-files-found: ignore
          retention-days: 7

  # A few sentences about the update above its changelog, by a model (src/ops/brief.ts).
  # This job holds the model's key, so like `publish` it runs no dependency code: pinned
  # actions and one repository file under plain Node, which imports only Node's own
  # modules (a test holds it to that). The brief is optional: no key, a failed request or
  # an answer it doesn't use mean the PR goes out with `mfm diff`'s body and a warning,
  # and nothing here can fail the run. See "In brief, by a model" in
  # specs/change-tracking.md.
  brief:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # the brief is optional: `publish` goes ahead without it
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false # no job restores one
      - name: Fetch the update
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
          path: /tmp/update
      # The body with the brief, or as `mfm diff` wrote it; what happened goes to this
      # job's summary, and why there is no brief to a warning.
      - name: Write the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node --experimental-strip-types src/ops/brief.ts /tmp/update/changelog.md --previous /tmp/update/previous-body.md --out /tmp/brief/body.md --report "$GITHUB_STEP_SUMMARY"
      - name: Hand the body on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brief
          path: /tmp/brief/body.md
          if-no-files-found: ignore
          retention-days: 7

  # The only job that holds the App's key, so it runs pinned actions and a copy, and no
  # repository code. The App's token rather than GITHUB_TOKEN, whose events start no
  # workflows: that way the update PR gets CI. Its body is `brief`'s when that job wrote
  # one, `mfm diff`'s otherwise.
  publish:
    needs: [scrape, brief]
    # `brief` may fail or be skipped; the PR goes out either way, so only the scrape counts.
    if: ${{ !cancelled() && !inputs.dry-run && needs.scrape.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the base
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Everything `scrape` hands over is untrusted, since that job ran every dependency.
      # So the plan that steers the App's token is checked first, in plain bash and before
      # anything is checked out: the branch is an update branch, the base is main or
      # another one, and the base commit is on the base branch, not any commit the
      # repository can fetch (the base branch is it, or ahead of it).
      - name: Check the plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.scrape.outputs.branch }}
          BASE: ${{ needs.scrape.outputs.base }}
          BASE_SHA: ${{ needs.scrape.outputs.base-sha }}
        run: |
          set -euo pipefail
          update='^mfm/v[0-9]+(\.[0-9]+)*$'
          [[ "$BRANCH" =~ $update ]] || { echo "::error::Not an update branch: '$BRANCH'"; exit 1; }
          if ! { [[ "$BASE" == main || "$BASE" =~ $update ]] && [[ "$BASE" != "$BRANCH" ]]; }; then
            echo "::error::Not a base for $BRANCH: '$BASE'"
            exit 1
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Not a commit: '$BASE_SHA'"; exit 1; }
          status=$(gh api "repos/$GH_REPO/compare/$BASE_SHA...$BASE" --jq .status)
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "::error::$BASE_SHA is not on $BASE ($status)"
            exit 1
          fi

      # A fresh checkout of the commit `scrape` staged on, never a .git from the artifact:
      # git config can run commands, and create-pull-request runs git here. With `base`
      # given, create-pull-request rebases the commit onto the branch's current tip.
      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scrape.outputs.base-sha }}
          path: pub
          persist-credentials: false
      - name: Fetch the update
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
          path: /tmp/update
      # `brief`'s body, when it wrote one; without it the PR gets `mfm diff`'s.
      - name: Fetch the brief
        id: brief
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brief
          path: /tmp/brief

      # The staged update must be regular files where an update writes and nothing else:
      # no dot-files, links, subdirectories or .git.
      - name: Check what scrape handed over
        run: |
          set -euo pipefail
          cd /tmp/update/staged
          allowed='^(d \./(data|changelog)|f \./DATA-CHANGELOG\.md|f \./data/[a-z0-9-]+\.yaml|f \./data/points\.csv|f \./changelog/v[0-9.]+\.md)$'
          while IFS= read -r -d '' entry; do
            [[ "$entry" =~ $allowed ]] || { echo "::error::Not part of an update: ${entry#? }"; exit 1; }
          done < <(find . -mindepth 1 -printf '%y %p\0')

      # Only the paths the update writes, each replaced whole, so the tree is the one
      # `scrape` staged.
      - name: Stage the update on the base
        run: |
          rm -rf pub/data pub/changelog pub/DATA-CHANGELOG.md
          cp -r /tmp/update/staged/data /tmp/update/staged/changelog /tmp/update/staged/DATA-CHANGELOG.md pub/

      # Scoped to this repository (the default with no `owner` or `repositories`) and to
      # what create-pull-request needs. It expires within the hour, and is revoked when
      # the job ends.
      - name: Mint the App's token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BSDATA_AUTOMATON_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSDATA_AUTOMATON_APP_PRIVATE_KEY }}
          permission-contents: write # push the update branch
          permission-pull-requests: write # open or update the PR, and label it

      - name: Open pull request on change
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          path: pub
          branch: ${{ needs.scrape.outputs.branch }}
          base: ${{ needs.scrape.outputs.base }}
          title: ${{ needs.scrape.outputs.title }}
          body-path: ${{ steps.brief.outcome == 'success' && '/tmp/brief/body.md' || '/tmp/update/changelog.md' }}
          commit-message: 'data: ${{ needs.scrape.outputs.title }}'
          labels: mfm-update
          delete-branch: true

  # A dry run skips `publish`, so this mints the same token on its own, in a job that runs
  # nothing else. It checks the App's credentials and permissions; the token goes unused.
  app-check:
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Mint the App's token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BSDATA_AUTOMATON_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSDATA_AUTOMATON_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

  # None of these steps needs to start a workflow, so all use the default token. The Discord
  # marker must be github-actions[bot]'s anyway: src/ops/announce.ts honours no other.
  announce:
    needs: [scrape, publish]
    # The explicit result keeps this independent of how a failed `brief`, upstream of
    # `publish`, is counted.
    if: ${{ !cancelled() && !inputs.dry-run && needs.publish.result == 'success' && needs.publish.outputs.pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      pull-requests: write # link the stack, label the PR, and read and write the Discord marker
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: false # "No dependency cache" in specs/change-tracking.md
          cache-dependency-path: .github/no-dependency-cache # matches no file: no cache at all
      - name: Fetch the update
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
          path: /tmp/update

      # Link the chain as a GitHub stacked PR, so it merges bottom-up. Best-effort:
      # GitHub doesn't document whether GITHUB_TOKEN may create stacks, and the
      # base-branch chain stands without it (GitHub retargets the PR above when the
      # branch below is deleted on merge).
      #
      # gh pins a binary extension only by its release tag, and gh-stack's releases aren't
      # immutable, so the binary is checked against its SHA-256 and installed from disk.
      - name: Link the update stack
        if: needs.scrape.outputs.below != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_STACK_NO_UPDATE_NOTIFIER: '1'
          BELOW: ${{ needs.scrape.outputs.below }}
          PR: ${{ needs.publish.outputs.pr }}
          VERSION: v0.2.1
          SHA256: ffe9d48b6342faffc3b0cb420202ff1df32e24faf32693debd7423274bbdf859 # linux-amd64
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gh-stack"
          mkdir -p "$dir"
          gh release download "$VERSION" --repo github/gh-stack --pattern linux-amd64 --output "$dir/gh-stack"
          echo "$SHA256  $dir/gh-stack" | sha256sum --check --strict
          chmod +x "$dir/gh-stack"
          (cd "$dir" && gh extension install .)
          read -ra below <<< "$BELOW" # the PRs below, bottom first
          gh stack link "${below[@]}" "$PR"

      # The needs-attention label, on while the update has a change the scraper may have
      # misread and off once a later run finds none (see "Needs attention" in
      # specs/change-tracking.md); the PR body lists them. continue-on-error, like the
      # announcement below: a label that didn't stick is not a scrape failure.
      - name: Label the PR when something needs attention
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.publish.outputs.pr }}
        run: node_modules/.bin/tsx src/bin/mfm.ts attention /tmp/update/old-data /tmp/update/new-data --label --pr-number "$PR"

      # One Discord message per MFM update, not per scrape run: `--record` keeps its id
      # in a hidden marker on an update PR comment, and edits that message on later runs
      # (src/ops/announce.ts). It writes no marker for an id that isn't numeric. Delete
      # the comment to force a repost.
      #
      # continue-on-error, deliberately: a Discord outage must not fail this job, because
      # `report` would then open a "the source markup may have drifted" issue, which would
      # be a lie.
      - name: Announce on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.publish.outputs.pr }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # No --changelog-url: at announce time main has yesterday's changelog, not this
        # update's. The PR body is the changelog, so that is what the embed links to.
        run: node_modules/.bin/tsx src/bin/mfm.ts announce /tmp/update/old-data /tmp/update/new-data --send --record --pr-number "$PR" --pr-url "$REPO_URL/pull/$PR"

  # One issue per outage, not per day: a failure in any job while a `scrape-failure`
  # issue is open is reported as a comment on it, and the next successful run closes it
  # (src/ops/failure-issue.ts). A job that timed out, or lost its runner, ends as
  # `cancelled` while the run goes on, so that counts as a failure here too; a run that
  # was cancelled skips this job. A dry run touches neither: its own red run is the report.
  report:
    needs: [scrape, publish, announce]
    if: ${{ !cancelled() && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      issues: write # open, comment on and close the scrape-failure issue
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: false # "No dependency cache" in specs/change-tracking.md
          cache-dependency-path: .github/no-dependency-cache # matches no file: no cache at all

      # Absent when the scrape failed before writing it; report-failure then says so.
      - name: Fetch the failure report
        if: needs.scrape.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: failure-report
          path: /tmp

      - name: Report the failure
        id: report
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node_modules/.bin/tsx src/bin/mfm.ts report-failure --details /tmp/failures.md

      # The report above needs the checkout and node_modules. When this job failed before
      # it had them (checkout, pnpm/setup, the install), or the report itself failed, this
      # files the failure with gh alone, the same way: a comment on the open issue, or a
      # new one. The one place the workflow keeps logic, because it must run without mfm.
      - name: Report the failure without mfm
        if: failure() && steps.report.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The scheduled MFM scrape failed before mfm could report it (in checkout or setup, or in the report step itself), so there is no per-faction detail: $RUN"
          open=$(gh issue list --label scrape-failure --state open --json number --jq 'map(.number) | min // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label scrape-failure --title "Scrape failed ($(date -u +%F))" --body "$body"
          fi

      - name: Close the failure issue
        if: needs.scrape.result == 'success' && needs.publish.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node_modules/.bin/tsx src/bin/mfm.ts resolve-failure
