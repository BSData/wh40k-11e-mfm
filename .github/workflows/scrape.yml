name: Scrape MFM

on:
  schedule:
    - cron: '0 16 * * *' # daily 16:00 UTC
  workflow_dispatch: # manual trigger

permissions: {}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the update PR, and comment its Discord marker
      issues: write # open, comment on and close the scrape-failure issue
    steps:
      # The fetches below need no credentials (the repository is public), and
      # create-pull-request configures its own token to push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: true
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Update PRs are sticky: each one's branch is force-pushed on every run while its
      # version is live. Their data/ already carries the `firstSeen` stamps of the changes
      # they captured, so the scrape matches against every open one as well as against
      # main — a run that finds nothing new re-stamps nothing and so reproduces the branch
      # byte for byte (no force-push, and the PR keeps its start date), while a later
      # change widens the reported date range instead of resetting it to today.
      # Branch names reach the shell through env and word splitting only, never ${{ }}.
      - name: Fetch the open update PRs' dates
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --label mfm-update --state open \
            --json number,headRefName,baseRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not) | select(.headRefName | startswith("mfm/"))]' \
            > /tmp/update-prs.json
          dates=""
          for branch in $(jq -r '.[].headRefName' /tmp/update-prs.json); do
            git fetch --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            mkdir -p "/tmp/pr-data/$branch"
            git archive "origin/$branch" data | tar -x -C "/tmp/pr-data/$branch" --strip-components=1
            dates="$dates --dates-from /tmp/pr-data/$branch"
            echo "Matching dates against the open $branch PR."
          done
          echo "dates=$dates" >> "$GITHUB_OUTPUT"

      - name: Scrape
        env:
          DATES: ${{ steps.open.outputs.dates }}
        # $DATES is unquoted on purpose: one `--dates-from <dir>` pair per open PR.
        run: pnpm scrape --report /tmp/failures.md $DATES

      # The announcement is rendered after the PR step (it links to the PR), by which
      # point create-pull-request has had the working tree. Keep it a copy.
      - name: Snapshot scraped data
        run: |
          mkdir -p /tmp/new-data
          cp -r data/. /tmp/new-data/

      # One PR per MFM version, stacked: the live version's open PR is updated on its own
      # base, and a new version gets a new PR on top of the open one instead of
      # rebuilding it. See "One PR per version, stacked" in specs/change-tracking.md.
      - name: Plan the update PR
        id: plan
        run: pnpm exec tsx src/stack.ts /tmp/update-prs.json data >> "$GITHUB_OUTPUT"

      # The PR is diffed against its base, not main: body, changelog entry and
      # announcement all compare the base's data/ with the scrape.
      - name: Snapshot the base's data
        env:
          BASE: ${{ steps.plan.outputs.base }}
        run: |
          git fetch --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          mkdir -p /tmp/old-data
          git archive "origin/$BASE" data | tar -x -C /tmp/old-data --strip-components=1

      - name: Generate changelog
        id: changelog
        run: |
          pnpm exec tsx src/diff.ts /tmp/old-data data --title-file /tmp/title.txt > /tmp/changelog.md
          echo "title=$(cat /tmp/title.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.md

      # The commit is built on a checkout of the base, so it carries the base's changelog
      # files plus this update's entry: changelog/v<version>.md and the regenerated
      # DATA-CHANGELOG.md index. The tools still run from main's checkout.
      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.base }}
          path: pub
          persist-credentials: false

      - name: Stage the update on the base
        working-directory: pub
        run: |
          rm -rf data
          cp -r ../data data
          ../node_modules/.bin/tsx ../scripts/update-data-changelog.ts /tmp/old-data data

      - name: Open pull request on change
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: pub
          branch: ${{ steps.plan.outputs.branch }}
          base: ${{ steps.plan.outputs.base }}
          title: ${{ steps.changelog.outputs.title }}
          body-path: /tmp/changelog.md
          commit-message: 'data: ${{ steps.changelog.outputs.title }}'
          labels: mfm-update
          delete-branch: true

      # Link the chain as a GitHub stacked PR, so it merges bottom-up. Best-effort:
      # GitHub doesn't document whether GITHUB_TOKEN may create stacks, and the
      # base-branch chain stands without it (GitHub retargets the PR above when the
      # branch below is deleted on merge).
      - name: Link the update stack
        if: steps.pr.outputs.pull-request-number != '' && steps.plan.outputs.below != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_STACK_NO_UPDATE_NOTIFIER: '1'
          BELOW: ${{ steps.plan.outputs.below }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh extension install github/gh-stack --pin v0.2.1
          # $BELOW is unquoted on purpose: the PRs below, bottom first, as separate args.
          gh stack link $BELOW "$PR"

      # One Discord message per MFM update, not per scrape run. The sticky PR is the
      # update's identity, and the hidden marker on one of its comments is the whole of
      # the state: no marker means post, a marker means edit that message, so a multi-day
      # update reads as one announcement whose numbers widen — the way the PR title and
      # the changelog entry already do. The PR lives exactly as long as the update does,
      # so once it is merged and its branch deleted the next update starts clean. Delete
      # the comment to force a repost. See specs/change-tracking.md.
      #
      # The marker, rather than create-pull-request's `created`/`updated` output, is what
      # decides — which makes a failed post self-healing: it leaves no marker, so the next
      # run posts instead of assuming yesterday succeeded.
      #
      # continue-on-error, deliberately: a Discord outage must not fail this job, because
      # the failure handler below would then open a "the source markup may have drifted"
      # issue, which would be a lie.
      - name: Announce on Discord
        if: steps.pr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Only the GitHub half lives here: read the marker, then record a new one. The
          # post/edit decision is in src/discord.ts, where tests can drive it.
          id=$(gh pr view "$PR" --json comments --jq '
            [ .comments[].body
              | select(test("<!-- discord-message-id: [0-9]+ -->"))
              | capture("<!-- discord-message-id: (?<id>[0-9]+) -->").id
            ] | last // ""')
          # No --changelog-url: at announce time main has yesterday's changelog, not this
          # update's. The PR body is the changelog, so that is what the embed links to.
          posted=$(pnpm exec tsx src/discord.ts /tmp/old-data /tmp/new-data --send \
            --message-id "$id" \
            --pr-number "$PR" \
            --pr-url "$REPO_URL/pull/$PR")
          if [ -n "$posted" ]; then
            # "<id> [permalink]": $1 drives the next run's edit, $2 is the clickable link
            # (absent if the webhook wouldn't say which guild and channel it posts to).
            set -- $posted
            gh pr comment "$PR" \
              --body "Announced on Discord: ${2:-link unavailable} <!-- discord-message-id: $1 -->"
          fi

      # One issue per outage, not per day: a failure while a `scrape-failure` issue is
      # open is reported as a comment on it, and the next successful run (below) closes it.
      - name: Report the failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let details = '';
            try { details = fs.readFileSync('/tmp/failures.md', 'utf8').trim(); } catch {}
            const report = [
              `**Run log:** ${run}`,
              '',
              details || '_No per-faction detail was captured — the run likely failed outside parsing (network, browser launch, the index page itself, or a later step such as planning the update PR). Check the run log._',
              '',
              '---',
              'To fix, follow `.agents/skills/diagnose-parse/SKILL.md`. Each block above is the located parser error (including any unconsumed-content report from the completeness check).',
            ].join('\n');
            const { data: [open] } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'scrape-failure', state: 'open', sort: 'created', direction: 'asc', per_page: 1,
            });
            if (open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.number,
                body: `The scheduled MFM scrape failed again.\n\n${report}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `Scrape failed (${new Date().toISOString().slice(0, 10)})`,
                labels: ['scrape-failure'],
                body: `The scheduled MFM scrape failed — the source site markup may have drifted, or a faction stopped parsing.\n\n${report}`,
              });
            }

      - name: Close the failure issue
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'scrape-failure', state: 'open',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `The scheduled scrape succeeded again: ${run}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
