name: Scrape MFM

on:
  schedule:
    - cron: '0 16 * * *' # daily 16:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Snapshot current data
        run: |
          mkdir -p /tmp/old-data
          cp -r data/. /tmp/old-data/ 2>/dev/null || true

      # The update PR is sticky: its branch is force-pushed on every run. Its data/
      # already carries the `firstSeen` stamps of the changes it captured, so the
      # scrape matches against it as well as against main — a run that finds nothing
      # new re-stamps nothing and so reproduces the branch byte for byte (no
      # force-push, and the PR keeps its start date), while a later change widens the
      # reported date range instead of resetting it to today.
      - name: Fetch the open update PR's dates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: mfm/auto-update
        run: |
          mkdir -p /tmp/pr-data
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            git fetch --depth=1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git archive "origin/$BRANCH" data | tar -x -C /tmp/pr-data --strip-components=1
            echo "Matching dates against the open $BRANCH PR."
          else
            echo "No open update PR — dates start fresh."
          fi

      - name: Scrape
        run: pnpm scrape --report /tmp/failures.md --dates-from /tmp/pr-data

      - name: Generate changelog
        id: changelog
        run: |
          pnpm exec tsx src/diff.ts /tmp/old-data data --title-file /tmp/title.txt > /tmp/changelog.md
          echo "title=$(cat /tmp/title.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.md

      - name: Update DATA-CHANGELOG.md
        run: pnpm exec tsx scripts/update-data-changelog.ts /tmp/old-data data

      - name: Open pull request on change
        uses: peter-evans/create-pull-request@v8
        with:
          branch: mfm/auto-update
          base: main
          title: ${{ steps.changelog.outputs.title }}
          body-path: /tmp/changelog.md
          commit-message: 'data: update MFM points values'
          labels: mfm-update
          delete-branch: true

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let details = '';
            try { details = fs.readFileSync('/tmp/failures.md', 'utf8').trim(); } catch {}
            const body = [
              'The scheduled MFM scrape failed — the source site markup may have drifted, or a faction stopped parsing.',
              '',
              `**Run log:** ${run}`,
              '',
              details || '_No per-faction detail was captured — the run likely failed before parsing (network, browser launch, or the index page itself). Check the run log._',
              '',
              '---',
              'To fix, follow `.agents/playbooks/diagnose-parse.md`. Each block above is the located parser error (including any unconsumed-content report from the completeness check).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scrape failed (${new Date().toISOString().slice(0, 10)})`,
              labels: ['scrape-failure'],
              body,
            });
