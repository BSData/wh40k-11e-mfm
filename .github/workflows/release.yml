name: Release

# A release of the dataset for every change to data/ on main: tagged
# mfm-v<version>+<date>, with the newest entry of changelog/v<version>.md as its notes,
# and all.json, points.csv, the JSON Schemas and data.zip attached. See "Releases" in
# specs/data-model.md.

on:
  push:
    branches: [main]
    # changelog/ too: a PR that adds a missing entry releases the data it describes. An
    # edit that adds no entry publishes nothing, since its tag is released with the
    # same data/.
    paths: ['data/**', 'changelog/**']
  # A preview on a PR that changes what a release is made from: `release-assets` runs as
  # on main, so the PR shows the tag and notes its merge would publish, and fails early
  # when its data/ changes without a new changelog entry. `publish` never runs for a PR.
  # The job isn't called `build`: that name is CI's required check, which this job,
  # running no tests, must never stand in for.
  pull_request:
    paths:
      - 'data/**'
      - 'changelog/**'
      - 'schema/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build the release and print it, but publish nothing
        type: boolean
        default: false

permissions: {}

# One real release at a time. GitHub keeps one pending run per group, so a third push
# while one runs and one waits cancels the waiting one: its data is in the newer
# release, and a re-run of the cancelled run releases its own entry. A dry run, a PR's
# preview or a run on another branch can publish nothing, so it gets a group of its own
# and never cancels a real one.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run && 'release' || format('release-preview-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Everything that runs the project's code, with a read-only token: the checks, the
  # assets, the notes, and whether the tag is released already (src/bin/commands/release.ts).
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code, and look the tag up among the releases
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      publish: ${{ steps.release.outputs.publish }}
      reason: ${{ steps.release.outputs.reason }}
    steps:
      # Audit only: records outbound connections and processes, blocks nothing.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: what this job installs goes into a release.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node
          node-version-file: .node-version
          require-lockfile: true

      - name: Build the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: node_modules/.bin/tsx src/bin/mfm.ts release --assets "$RUNNER_TEMP/release/assets" --notes-file "$RUNNER_TEMP/release/notes.md" --commit "$COMMIT" --output "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          REASON: ${{ steps.release.outputs.reason }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$PUBLISH" != true ]; then
            what="Nothing to publish: $REASON."
          elif [ "$DRY_RUN" = true ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            what="A real run on main would publish $TAG ($REASON). This one publishes nothing."
          else
            what="Publishing $TAG ($REASON)."
          fi
          {
            echo "## $TITLE"
            echo
            echo "$what"
            echo
            echo "Assets:"
            echo
            for asset in "$RUNNER_TEMP"/release/assets/*; do
              echo "- \`$(basename "$asset")\`, $(stat -c %s "$asset") bytes"
            done
            echo
            echo "### Notes"
            echo
            cat "$RUNNER_TEMP/release/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  # The only job that can write, and it runs no code from the repository or its
  # dependencies: pinned actions, the artifact, and gh. gh uploads the assets to a draft and publishes it
  # once they are all there, which immutable releases need. The release is marked latest
  # only while its commit is still main's head, so a late re-run of an older run can't
  # point releases/latest at older data.
  publish:
    needs: release-assets
    # A real run on main only: a dry run, a PR's preview or a run on another branch
    # publishes nothing.
    if: ${{ needs.release-assets.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      # Audit only, as in every job (see "Workflow integration" in specs/change-tracking.md).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-assets.outputs.tag }}
          TITLE: ${{ needs.release-assets.outputs.title }}
          COMMIT: ${{ github.sha }}
        run: |
          if ! [[ "$TAG" =~ ^mfm-v[0-9]+(\.[0-9]+)*\+[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error title=Not a release tag::$TAG"
            exit 1
          fi
          latest=false
          if [ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$COMMIT" ]; then
            latest=true
          fi
          gh release create --target "$COMMIT" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release/notes.md" --latest="$latest" \
            -- "$TAG" "$RUNNER_TEMP"/release/assets/*
