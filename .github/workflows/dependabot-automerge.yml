# Merges Dependabot's minor and patch updates once `build` passes, and leaves the rest for a
# maintainer. See "Dependabot auto-merge" in specs/change-tracking.md.
name: Dependabot auto-merge

on:
  pull_request:
    # edited: a change of base is checked again.
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    # The PR's author, not github.actor: the actor is whoever caused this event, and
    # Dependabot can be made the actor on someone else's PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'BSData/wh40k-11e-mfm'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the wait for the smoke test gives up after 45
    permissions:
      contents: write # auto-merge squashes the PR into main
      pull-requests: write # turn auto-merge on or off, and comment on a held update
      actions: read # find this commit's smoke test run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      # Auto-merge this job turned on. One a maintainer turned on is theirs to keep.
      OURS: '.autoMergeRequest.enabledBy.login // "" | IN("github-actions", "github-actions[bot]")'
    steps:
      # A run for an older commit (a re-run, say) decides nothing: the run for the PR's
      # head does. Otherwise start closed: auto-merge that an earlier run turned on, for an
      # earlier commit, is turned off while this one is decided, so that commit's checks
      # can't merge this one. Only a merge decision turns it on again, for this commit.
      - name: Start closed
        id: head
        run: |
          set -euo pipefail
          view=$(gh pr view "$PR" --json headRefOid,autoMergeRequest)
          if [ "$(jq -r .headRefOid <<< "$view")" != "$SHA" ]; then
            echo "::notice::The PR's head has moved on from $SHA, so the run for the new head decides."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          if [ "$(jq "$OURS" <<< "$view")" = true ]; then
            gh pr merge "$PR" --disable-auto
          fi

      # Fails unless the PR's author is Dependabot and its first commit carries GitHub's
      # signature. The rest of the commits are checked below.
      - name: Read the update's metadata
        id: meta
        if: steps.head.outputs.current == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # One decision, closed by default: merge only when nothing below gives a reason to
      # hold.
      - name: Decide
        id: decide
        if: steps.head.outputs.current == 'true'
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          pr=$(gh pr view "$PR" --json commits,files)
          reason=""
          # Per dependency: a group's own update-type is the highest type it can tell, and
          # silently passes over one it can't.
          if ! jq -e 'length > 0 and all(.[]; .updateType == "version-update:semver-minor" or .updateType == "version-update:semver-patch")' \
            <<< "$DEPS" > /dev/null; then
            reason="it includes a major update, or one whose type is unknown"
          elif ! jq -e '[.commits[].authors[].login] | length > 0 and all(. == "dependabot[bot]")' <<< "$pr" > /dev/null; then
            reason="it has commits that aren't Dependabot's"
          elif jq -e 'any(.files[].path; startswith(".github/workflows/"))' <<< "$pr" > /dev/null; then
            # GITHUB_TOKEN may not merge a change to a workflow, and the App's key isn't
            # readable from a run Dependabot started.
            reason="it changes workflow files, which this job's token isn't allowed to merge"
          elif jq -e 'any(.files[].path; test("^(src/|package\\.json$|pnpm-lock\\.yaml$|pnpm-workspace\\.yaml$|\\.node-version$)"))' \
            <<< "$pr" > /dev/null; then
            # The paths smoke.yml runs on (keep the two lists in step). Auto-merge waits
            # only for required checks, and smoke can't be one, since it doesn't run on
            # every PR: so wait here for this commit's live scrape, in this repository,
            # and hold unless it passed. A cheerio or Playwright update that misreads
            # today's site would otherwise merge, and the next scheduled scrape would fail.
            # The wait outlasts smoke's own 30-minute timeout.
            deadline=$((SECONDS + 2700))
            smoke=""
            while [ -z "$smoke" ] && [ "$SECONDS" -lt "$deadline" ]; do
              smoke=$(gh api "repos/$GH_REPO/actions/workflows/smoke.yml/runs?head_sha=$SHA&event=pull_request" \
                --jq '[.workflow_runs[] | select(.head_repository.full_name == env.GH_REPO)] | max_by(.id) // {} | select(.status == "completed") | .conclusion')
              [ -n "$smoke" ] || sleep 30
            done
            [ "$smoke" = success ] || reason="its live smoke test didn't pass (${smoke:-not finished within 45 minutes})"
          fi
          if [ -n "$reason" ]; then
            echo "decision=hold" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "decision=merge" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge once build passes
        if: steps.decide.outputs.decision == 'merge'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Auto-merge waits only for the checks the branch's rules require. Without a rule
          # requiring build it would merge at once, untested, so enable nothing then.
          required=$(gh api "repos/$GH_REPO/rules/branches/$(jq -rn --arg b "$BASE" '$b | @uri')" --jq \
            'any(.[]; .type == "required_status_checks" and any(.parameters.required_status_checks[]; .context == "build"))')
          if [ "$required" != true ]; then
            echo "::error title=No required build check::$BASE has no rule requiring the build check, so auto-merge would not wait for it. Add it to the ruleset, then re-run this job."
            exit 1
          fi
          # For this commit only: if Dependabot has pushed since, GitHub refuses.
          gh pr merge "$PR" --auto --squash --match-head-commit "$SHA"

      - name: Hold for a maintainer
        if: steps.decide.outputs.decision == 'hold'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          # One comment per PR, however often Dependabot rebases it. Only this job's own
          # count, so nobody else's comment can stand in for it.
          held=$(gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.author.login == "github-actions" and (.body | contains("<!-- dependabot-automerge: held -->")))] | length')
          if [ "$held" = 0 ]; then
            gh pr comment "$PR" --body "Not merged automatically: $REASON. A maintainer reviews and merges this one. <!-- dependabot-automerge: held -->"
          fi

      # Closed on failure too: an auto-merge an earlier run turned on mustn't outlive a
      # decision this run couldn't make. A run for an older commit leaves it to the
      # current one.
      - name: Turn auto-merge off after a failure
        if: failure() && steps.head.outputs.current != 'false'
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR" --json autoMergeRequest --jq "$OURS")" = true ]; then
            gh pr merge "$PR" --disable-auto
          fi
