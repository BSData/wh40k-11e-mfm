name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
