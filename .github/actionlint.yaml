paths:
  .github/workflows/scrape.yml:
    ignore:
      # Exactly two word splits, each on purpose as the comment beside it says: $DATES (one
      # --dates-from pair per open update PR) and $BROWSER (the cross-check's flag, or
      # nothing), both in "Scrape". The positions are within that step's script, so any
      # other SC2086 in this file is still reported.
      - 'SC2086:info:(1:39|1:46):'
