paths:
  .github/workflows/scrape.yml:
    ignore:
      # Exactly three word splits, each on purpose as the comment beside it says: $DATES
      # (one --dates-from pair per open update PR, in "Scrape"), $BELOW (the PRs below, in
      # "Link the update stack") and $posted (the two fields of the Discord reply, in
      # "Announce on Discord"). The positions are within each step's script, so any other
      # SC2086 in this file is still reported.
      - 'SC2086:info:(1:39|3:15|18:10):'
