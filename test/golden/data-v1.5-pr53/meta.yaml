notes: |-
  To muster a Warhammer 40,000 army, you will need the points values for your chosen units and **enhancements**, and the Detachment Points (DP) for your chosen **detachments**. A guide to mustering an army can be found in the Warhammer 40,000 app. Points values that were raised or lowered in the most recent update are marked with red or green, with the change shown in brackets.

  ## UNITS

  A unit’s points cost can vary as follows:

  - **Starting Strength**: The number of models a unit contains can affect its points cost. This may change per model (e.g. 1 model, 2 models, 3 models, etc.) or it may be presented with a lower and upper limit to **starting strength** (e.g. one cost for 5 models, another cost for 10 models). In the latter case, your units can contain a number of models in between these limits, but you must still pay the maximum points cost for a unit that contains more than its minimum number of models.
  - **Requisition Thresholds**: If you include the same unit (at any size) in your army more than a stated number of times, the points costs of those additional units may vary (e.g. if a unit has an entry stating ‘Your 3rd+ Units Cost’, you could select that unit twice at the normal cost, then subsequent selections would cost that higher amount).
  - **Wargear**: Some units have a points cost associated with a wargear item they can take. In all cases, these costs are per item taken, and are applied on top of the unit's main points cost.

  If a unit has the **Leader/Support** ability, the units it can be attached to are listed after its points values.

  ## DETACHMENTS

  Each **detachment** entry features the following information:

  - **Detachment Points (DP)**: The number of DP you can spend on **detachments** depends on the battle size (see the Warhammer 40,000 app).
  - **Force Disposition**: Each **detachment** grants your army a Force Disposition, which can affect the missions you will play.
  - **Enhancements**: The points costs for each **enhancement** featured in that **detachment**.
  - **Unique Tag**: Some **detachments** are tagged with a ‘Unique’ word or phrase. You cannot select more than one **detachment** that has the same one of these tags.
muster: |-
  The following rules tell you how to create an army list out of models and units from your Warhammer 40,000 collection.

  ## START YOUR ARMY ROSTER

  The details of your army must be recorded on an army roster. You can either write this down or use the Warhammer 40,000 app. Players should show their finished army roster to their opponent before battle commences.

  ## SELECT ARMY FACTION

  Note on your army roster one faction keyword to be your **army faction**.

  ## SELECT BATTLE SIZE

  With your opponent, select one of the battle sizes below. This will determine the total number of points (also known as the points total) each player can spend to build their army. The points values for units can be found in the Warhammer 40,000 app. You will need to refer to these when building your army.

  The battle size will also determine the total number of Detachment Points (DP) players will have to unlock **detachments** with, the number of units with the same datasheet name that they can include in their army, and the number of **enhancements** that they can include in their army.

  These are summarised below.

  | Battle Size  | Points Total | Detachment Points (DP) | Enhancement Limit | Unit Limit\* |
  | ------------ | ------------ | ---------------------- | ----------------- | ------------ |
  | INCURSION    | 1000         | 2                      | 2                 | 2            |
  | STRIKE FORCE | 2000         | 3                      | 4                 | 3            |

  \* The unit limit for **BATTLELINE** and **DEDICATED TRANSPORT** units is double the relevant amount shown above, and every **EPIC HERO** has a unit limit of 1, regardless of the battle size.

  ## FILL YOUR ARMY ROSTER

  You will now select your **detachments**, units, **WARLORD** and **enhancements** that will be in your army. You will also attach your **leader** and **support** units to other units.

  When doing so:

  - You cannot exceed any of the values presented in the Select Battle Size table (25.03). For example, in an Incursion battle, you cannot select **detachments** with a combined value of more than 2 DP.
  - No unit (including **attached** units) can have more than one **enhancement**.
  - Your army roster must follow all restrictions placed on it by the rules and units being included in it.

  ## SELECT DETACHMENTS

  You can now use your DP to select **detachments** for your army. You can only select from those available to your **army faction**. Each one will give you access to different **force dispositions**, **detachment rules**, **enhancements** and/or **stratagems** to use in the coming battle. You cannot select the same **detachment** more than once. Record your selected **detachments** on your army roster.

  Note that some **detachment rules** list units and other **detachments** that your army either must include or cannot include; you must follow all such rules when building your army for the **detachments** you have selected.

  ## SELECT UNITS

  Select all the units you want to include in your army. You can only select units with your faction keyword and units available to your **army faction**. Each time you include a unit in your army, it can take any wargear or options it has access to. Note on your army roster the number of models in the unit, any wargear and upgrades it has, and its points value.

  Select one **CHARACTER** unit to be your Warlord’s unit. This must be a unit that has the faction keyword you chose as your **army faction**. Then select one **CHARACTER** model in that unit to be your Warlord – the supreme leader of your army – and make a note of this on your army roster. That model gains the **WARLORD** keyword. Some units have a rule on their datasheet stating that they must be your **WARLORD**. If you want to include one or more of these units in your army, you must select one of them to be your **WARLORD**. Rules that state that a model cannot be your **WARLORD** take precedence over ones that require it to be your **WARLORD**.

  ## ATTACH LEADERS AND SUPPORT UNITS

  For each **leader** and **support** unit in your roster, you can attach them to a **bodyguard** unit that they can join, following the rules for Forming Attached Units (19.01). Each **support** unit in your roster must be attached to a **bodyguard** unit.

  ## SELECT ENHANCEMENTS

  Select all of the **enhancements** you want to include from the **detachments** you selected and give each one to a different unit in your army. When you do, increase those units’ points values accordingly. The points values for **enhancements** can be found in the Warhammer 40,000 app.

  Unless otherwise stated:

  - Only **CHARACTER** units can be given **enhancements**. If such a unit contains more than one model, select one **CHARACTER** model in that unit to have that **enhancement**.
  - **EPIC HEROES** models cannot be given **enhancements**.
  - Your army cannot include more than one of the same **enhancement**.

  **Upgrades:**
  Some **enhancements** are tagged with ‘Upgrade'. Unlike other **enhancements**:

  - These can be given to non-**CHARACTER** units.
  - You can include up to three of the same Upgrade in your army (the second and third instances of the same Upgrade do not count towards the total number of **enhancements** in your army, but you must still spend the stated points cost each time).

  \*\* If you are playing an Incursion battle, you can select a 3DP **detachment** as your only **detachment**.
